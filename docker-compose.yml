
services:
  postgres:
    image: postgres:17
    container_name: trexton-postgres
    environment:
      POSTGRES_USER: trexton
      POSTGRES_PASSWORD: trexton_dev
      POSTGRES_DB: trexton
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: trexton-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
